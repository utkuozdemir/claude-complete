version: "3"

# Everything runs on the host toolchain, since no build tags hide code from a macOS host.

tasks:
  fmt:
    desc: format code
    cmds:
      - go mod tidy
      - golangci-lint run --fix --issues-exit-code 0 --build-tags live ./...
      - golangci-lint fmt ./...

  lint:
    desc: lint code, docs, module tidiness and the release configuration
    cmds:
      # tracked files only
      - git ls-files '*.md' | xargs markdownlint
      # the live test is behind a build tag
      - golangci-lint run --build-tags live ./...
      - go mod tidy -diff
      - goreleaser check

  test:
    desc: run the tests, including the shell tests for each shell that is installed
    cmds:
      - go test -race ./...

  # one target at a time, as -fuzz takes one. A failure goes to testdata/fuzz, into the commit that fixes it.
  test:fuzz:
    desc: 'search for new fuzz failures (FUZZTIME=30s per target)'
    vars:
      FUZZTIME: '{{.FUZZTIME | default "30s"}}'
    cmds:
      - |
        set -eu
        for pkg in $(go list ./...); do
          listed="$(go test -list 'Fuzz' "$pkg")"
          for target in $(printf '%s\n' "$listed" | grep '^Fuzz' || true); do
            echo "==> $pkg $target ({{.FUZZTIME}})"
            go test "$pkg" -run '^$' -fuzz "^${target}\$" -fuzztime '{{.FUZZTIME}}'
          done
        done

  bench:
    desc: run the benchmarks, with memory statistics
    cmds:
      - go test -run '^$' -bench . -benchmem ./...

  test:live:
    desc: walk the claude installed on this machine
    cmds:
      - go test -count=1 -tags live -run TestLive ./...

  release:
    desc: tag the next version from the tip of main, which starts the release workflow
    vars:
      NEXT:
        # renovate: depName=caarlos0/svu datasource=docker
        sh: docker run --rm -v "$PWD":/src -w /src caarlos0/svu:3.4.1 next
    cmds:
      - git fetch --tags --force origin main
      - test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo "HEAD is not the tip of origin/main" >&2; exit 1; }
      - test -z "$(git status --porcelain)" || { echo "the working tree is not clean" >&2; exit 1; }
      - git tag -a {{.NEXT}} -m "{{.NEXT}}"
      - git push origin {{.NEXT}}
