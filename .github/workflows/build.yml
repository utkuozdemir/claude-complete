---
name: build

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - renovate/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euox pipefail {0}

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # renovate: depName=golangci/golangci-lint
          version: v2.14.0
          args: --build-tags live
      - name: Lint markdown
        # renovate: depName=markdownlint-cli datasource=npm
        run: git ls-files '*.md' | xargs npx --yes markdownlint-cli@0.49.1
      - name: Check module tidiness
        run: go mod tidy -diff
      - name: Check the release configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: check
      # the shell tests skip a shell that is missing, so install every one of them
      - name: Install the shells
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: Run tests
        run: go test -v -race ./...
