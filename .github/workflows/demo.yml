---
name: demo

# Re-records the README demo and opens a pull request with the result, so the recording can be refreshed from
# the GitHub UI. Nothing triggers it automatically, since each run commits another GIF.
on:
  workflow_dispatch:
    inputs:
      open_pull_request:
        description: "Open a pull request with the new recording"
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euox pipefail {0}

jobs:
  record:
    runs-on: ubuntu-26.04
    permissions:
      contents: write # push the branch with the recording
      pull-requests: write # open the pull request
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # the same steps a maintainer runs locally, in the recorder's image with zsh and claude added
      - name: Record
        run: task demo:record
      - name: Upload the recording
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-recording
          path: img/demo.gif
      - name: Open a pull request
        if: inputs.open_pull_request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- img; then
            echo "the recording did not change, nothing to open"
            exit 0
          fi

          branch="demo-recording-${{ github.run_id }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git commit -s -m "docs: re-record the README demo" -m \
            "Regenerated by the demo workflow from demo/demo.tape. Run ${{ github.run_id }}." \
            -- img
          git push origin "${branch}"

          gh pr create \
            --title "docs: re-record the README demo" \
            --body "Regenerated by the [demo workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Approve the build run, review the image in the diff, then merge or close." \
            --base "${{ github.ref_name }}" \
            --head "${branch}"
